[workspace]
members = ["crates/core", "crates/bridge", "crates/desktop"]
exclude = ["vendor/zorite-editor"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros"] }
chrono = { version = "0.4", features = ["serde"] }
tempfile = "3"

[profile.dev]
debug = 0

[profile.test]
debug = 0

[patch.crates-io]
zorite-editor = { path = "vendor/zorite-editor" }
